<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula 3D Viewer - Single File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Glassmorphism helpers */
      .glass {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Active image animation in dock */
      .dock-item.active img {
        transform: scale(1.1);
        border-color: #60A5FA;
        box-shadow: 0 0 15px rgba(96,165,250,0.5);
      }
      .dock-item.active .label {
        opacity: 1;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
    </script>
  </head>
  <body class="text-white select-none">
    
    <!-- Canvas Container -->
    <canvas id="canvas" class="absolute inset-0 w-full h-full bg-neutral-900 cursor-grab active:cursor-grabbing"></canvas>

    <!-- Overlay UI -->
    <div class="absolute inset-0 pointer-events-none">
      
      <!-- Header -->
      <div class="absolute top-6 left-6 opacity-60">
        <h1 class="text-2xl font-bold tracking-tighter">NEBULA<span class="text-blue-500">.3D</span></h1>
        <p class="text-[10px] tracking-[0.2em] mt-1 text-gray-400">PURE VANILLA JS ENGINE</p>
      </div>

      <!-- Controls Panel -->
      <div class="pointer-events-auto absolute top-4 right-4 w-72 glass rounded-2xl p-6 shadow-2xl transition-all duration-300 hover:bg-black/50 z-20">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-sm font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
            CONTROL DECK
          </h2>
          <button id="btn-auto-ai" class="flex items-center gap-2 px-3 py-1.5 bg-gradient-to-r from-purple-600 to-blue-600 rounded-lg text-xs font-semibold hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            <span id="ai-icon">✨</span> Gemini AI
          </button>
        </div>

        <div class="space-y-6">
          <!-- Mode Switch -->
          <div class="flex bg-white/5 rounded-lg p-1">
            <button id="mode-structure" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all bg-white/20 text-white shadow-sm">
              STRUCTURE
            </button>
            <button id="mode-nebula" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white">
              NEBULA
            </button>
          </div>

          <!-- Sliders -->
          <div class="space-y-3">
            <div class="space-y-1">
              <div class="flex justify-between text-xs text-gray-400">
                <span>Density (Gap)</span>
                <span id="val-gap">3px</span>
              </div>
              <input type="range" id="input-gap" min="1" max="10" step="1" value="3" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>

            <div class="space-y-1">
              <div class="flex justify-between text-xs text-gray-400">
                <span>Fluidity (Friction)</span>
                <span id="val-friction">0.92</span>
              </div>
              <input type="range" id="input-friction" min="0.80" max="0.99" step="0.01" value="0.92" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-purple-500">
            </div>

            <div class="space-y-1">
              <div class="flex justify-between text-xs text-gray-400">
                <span>Particle Size</span>
                <span id="val-size">2.0px</span>
              </div>
              <input type="range" id="input-size" min="0.5" max="5.0" step="0.1" value="2.0" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-pink-500">
            </div>
          </div>
        </div>
      </div>

      <!-- Dock -->
      <div class="pointer-events-auto absolute bottom-8 left-1/2 -translate-x-1/2 h-24 glass rounded-full px-4 flex items-center gap-4 shadow-2xl z-20 max-w-[90vw] overflow-x-auto no-scrollbar" id="dock-container">
        <!-- Images will be injected here via JS -->
      </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" accept="image/*" class="hidden">

    <!-- MAIN SCRIPT -->
    <script type="module">
      import { GoogleGenAI, Type } from "@google/genai";

      // --- Helpers para Generar Imágenes Locales ---
      // Esto evita problemas de CORS y carga de imagenes externas al ejecutar localmente.
      function createPlaceholderImage(text, colorStart, colorEnd) {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 600;
        const ctx = canvas.getContext('2d');
        
        // 1. Dibujar el contenido principal (Rectángulo completo con gradiente)
        const grd = ctx.createLinearGradient(0, 0, 800, 600);
        grd.addColorStop(0, colorStart);
        grd.addColorStop(1, colorEnd);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 800, 600);
        
        // Elementos decorativos (círculos)
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath();
        ctx.arc(400, 300, 220, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(150, 150, 80, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(650, 450, 100, 0, Math.PI * 2);
        ctx.fill();

        // Texto
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.font = 'bold 120px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 20;
        ctx.fillText(text, 400, 300);

        // 2. MÁSCARA DE DIFUMINADO (Vignette)
        // Usamos composite operation para mantener solo lo que se superpone con el gradiente radial
        ctx.globalCompositeOperation = 'destination-in';
        
        const centerX = 400;
        const centerY = 300;
        const radius = 380; // Radio del círculo visible

        const maskGradient = ctx.createRadialGradient(centerX, centerY, 100, centerX, centerY, radius);
        maskGradient.addColorStop(0, 'rgba(0,0,0,1)');   // Centro totalmente visible
        maskGradient.addColorStop(0.6, 'rgba(0,0,0,1)'); // Mantener visibilidad hasta el 60%
        maskGradient.addColorStop(1, 'rgba(0,0,0,0)');   // Bordes transparentes

        ctx.fillStyle = maskGradient;
        ctx.fillRect(0, 0, 800, 600);

        // Restaurar modo normal por si acaso se reutiliza el contexto (no necesario aquí pero buena práctica)
        ctx.globalCompositeOperation = 'source-over';
        
        return canvas.toDataURL('image/png'); // PNG para soportar transparencia
      }

      // --- Configuration Constants ---
      const SPACING = 2500; // Distancia AUMENTADA para mayor separación entre imágenes
      const FOCAL_LENGTH = 800;

      // Imágenes generadas localmente para garantizar que funcionen sin internet/proxy
      const INITIAL_IMAGES = [
        { id: '1', url: createPlaceholderImage('NEBULA', '#4f46e5', '#9333ea'), title: 'Nebula Core' },
        { id: '2', url: createPlaceholderImage('CODE', '#0ea5e9', '#10b981'), title: 'Cyber Space' },
        { id: '3', url: createPlaceholderImage('ART', '#f43f5e', '#f59e0b'), title: 'Creative' },
        { id: '4', url: createPlaceholderImage('DATA', '#8b5cf6', '#ec4899'), title: 'Data Flow' },
      ];

      /**
       * Particle Class
       * Representa un punto 3D derivado de un píxel.
       */
      class Particle {
        constructor(ox, oy, r, g, b, a) {
          this.x = (Math.random() - 0.5) * 3000; // Inicio explotado
          this.y = (Math.random() - 0.5) * 3000;
          this.z = (Math.random() - 0.5) * 3000;
          this.ox = ox; // Posición Objetivo X
          this.oy = oy; // Posición Objetivo Y
          this.r = r;
          this.g = g;
          this.b = b;
          this.a = a;
        }
      }

      /**
       * ImagePlane Class
       * Gestiona la carga de la imagen y la creación de partículas.
       */
      class ImagePlane {
        constructor(id, index, url) {
          this.id = id;
          this.index = index;
          this.url = url;
          this.particles = [];
          this.loaded = false;
          this.width = 0;
          this.height = 0;
        }

        load(gap, onComplete) {
          if (this.loaded) {
            if (onComplete) onComplete();
            return;
          }

          const img = new Image();
          img.crossOrigin = "Anonymous"; 
          img.src = this.url;
          
          img.onload = () => {
            this.width = img.width;
            this.height = img.height;

            // Escalar para rendimiento (máx 400px ancho/alto para análisis de partículas)
            const maxSize = 400;
            let scale = 1;
            if (this.width > maxSize || this.height > maxSize) {
              scale = Math.min(maxSize / this.width, maxSize / this.height);
            }

            const w = Math.floor(this.width * scale);
            const h = Math.floor(this.height * scale);

            // Canvas offscreen para leer píxeles
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            const data = ctx.getImageData(0, 0, w, h).data;
            this.particles = [];

            const cx = w / 2;
            const cy = h / 2;

            // Muestreo de píxeles
            for (let y = 0; y < h; y += gap) {
              for (let x = 0; x < w; x += gap) {
                const i = (y * w + x) * 4;
                const a = data[i + 3];

                if (a > 20) { // Ignorar transparentes (o muy transparentes por el gradiente)
                  const r = data[i];
                  const g = data[i + 1];
                  const b = data[i + 2];
                  // Mapear a espacio 3D (multiplicador para expandir)
                  this.particles.push(new Particle((x - cx) * 3, (y - cy) * 3, r, g, b, a / 255));
                }
              }
            }
            
            this.loaded = true;
            if (onComplete) onComplete();
          };
        }
        
        unload() {
          this.particles = [];
          this.loaded = false;
        }
      }

      /**
       * Engine Class
       * Motor principal de renderizado y lógica 3D.
       */
      class Engine {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d', { alpha: false });
          this.planes = new Map();
          
          // Estado de Cámara y Física
          this.cameraX = 0;
          this.targetCameraX = 0;
          this.mouseX = 0;
          this.mouseY = 0;
          this.targetMouseX = 0;
          this.targetMouseY = 0;
          this.lastMouseX = 0;
          this.lastMouseY = 0;
          this.isDragging = false;
          this.time = 0;
          this.running = false;

          // Configuración
          this.config = {
            gap: 3,
            friction: 0.92,
            size: 2.0,
            mode: 'structure'
          };

          this.resize();
          window.addEventListener('resize', () => this.resize());
          
          // Eventos del Mouse
          canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
          window.addEventListener('mousemove', (e) => this.onMouseMove(e));
          window.addEventListener('mouseup', () => this.onMouseUp());
          canvas.addEventListener('touchstart', (e) => this.onTouchStart(e), {passive: false});
          window.addEventListener('touchmove', (e) => this.onTouchMove(e), {passive: false});
          window.addEventListener('touchend', () => this.onMouseUp());
        }

        resize() {
          this.canvas.width = window.innerWidth;
          this.canvas.height = window.innerHeight;
          this.width = this.canvas.width;
          this.height = this.canvas.height;
        }

        setConfig(newConfig) {
          const oldGap = this.config.gap;
          this.config = { ...this.config, ...newConfig };
          
          // Si cambia la densidad (gap), recargar partículas
          if (oldGap !== this.config.gap) {
            this.planes.forEach(plane => {
              if (plane.loaded) {
                plane.unload();
              }
            });
          }
        }

        setImages(images) {
          // Eliminar antiguas
          const currentIds = new Set(images.map(i => i.id));
          for (const [id] of this.planes) {
            if (!currentIds.has(id)) this.planes.delete(id);
          }
          
          // Añadir nuevas o actualizar índice
          images.forEach((img, idx) => {
            if (!this.planes.has(img.id)) {
              this.planes.set(img.id, new ImagePlane(img.id, idx, img.url));
            } else {
              this.planes.get(img.id).index = idx;
            }
          });
        }

        setActiveIndex(index) {
          this.targetCameraX = index * SPACING;
        }

        start() {
          if (!this.running) {
            this.running = true;
            this.loop();
          }
        }

        onMouseDown(e) {
          this.isDragging = true;
          this.lastMouseX = e.clientX;
          this.lastMouseY = e.clientY;
        }

        onMouseMove(e) {
          if (this.isDragging) {
            const deltaX = e.clientX - this.lastMouseX;
            const deltaY = e.clientY - this.lastMouseY;
            this.targetMouseX += deltaX * 2;
            this.targetMouseY += deltaY * 2;
            this.lastMouseX = e.clientX;
            this.lastMouseY = e.clientY;
          }
        }

        onTouchStart(e) {
          if(e.touches.length > 0) {
            this.isDragging = true;
            this.lastMouseX = e.touches[0].clientX;
            this.lastMouseY = e.touches[0].clientY;
          }
        }

        onTouchMove(e) {
          if (this.isDragging && e.touches.length > 0) {
            e.preventDefault(); // Evitar scroll
            const deltaX = e.touches[0].clientX - this.lastMouseX;
            const deltaY = e.touches[0].clientY - this.lastMouseY;
            this.targetMouseX += deltaX * 2;
            this.targetMouseY += deltaY * 2;
            this.lastMouseX = e.touches[0].clientX;
            this.lastMouseY = e.touches[0].clientY;
          }
        }

        onMouseUp() {
          this.isDragging = false;
        }

        loop() {
          if (!this.running) return;
          
          this.time += 0.01;
          const { ctx, width, height } = this;
          
          // 1. Física Cámara (Lerp)
          this.cameraX += (this.targetCameraX - this.cameraX) * 0.05;

          // 2. Física Mouse (Inercia)
          if (!this.isDragging) {
            this.targetMouseX *= 0.95;
            this.targetMouseY *= 0.95;
          }
          this.mouseX += (this.targetMouseX - this.mouseX) * 0.1;
          this.mouseY += (this.targetMouseY - this.mouseY) * 0.1;

          // 3. Limpiar Pantalla
          ctx.fillStyle = '#050505';
          ctx.fillRect(0, 0, width, height);

          const cx = width / 2;
          const cy = height / 2;

          // 4. Renderizado
          this.planes.forEach(plane => {
            const planeX = plane.index * SPACING;
            const distFromCam = planeX - this.cameraX;

            // Sliding Window (Optimización de Memoria)
            // Aumentado el rango de descarga debido al mayor espaciado
            if (Math.abs(distFromCam) > SPACING * 1.5) {
              return; 
            }

            // Cargar si es necesario (Lazy loading)
            if (!plane.loaded) {
              plane.load(this.config.gap);
              return;
            }

            // Pre-cálculo de rotación
            const cosY = Math.cos(this.mouseX * 0.001);
            const sinY = Math.sin(this.mouseX * 0.001);
            const cosX = Math.cos(this.mouseY * 0.001);
            const sinX = Math.sin(this.mouseY * 0.001);

            const isNebula = this.config.mode === 'nebula';

            for (let i = 0; i < plane.particles.length; i++) {
              const p = plane.particles[i];

              // Objetivos de posición
              let tx = p.ox;
              let ty = p.oy;
              let tz = 0;

              if (isNebula) {
                // Efecto de ondas (Nebula)
                const wave = Math.sin(this.time * 2 + p.ox * 0.01) * 20 + Math.cos(this.time * 1.5 + p.oy * 0.01) * 20;
                tx += wave;
                ty += wave;
                tz += Math.sin(this.time + p.ox * 0.005) * 50;
              } else {
                // MODO STRUCTURE: Brillo determina profundidad
                // Calcular luminancia (0 a 1)
                // Y = 0.299*R + 0.587*G + 0.114*B
                const luminance = (p.r * 0.299 + p.g * 0.587 + p.b * 0.114) / 255;
                
                // Si es claro (Luminance ~ 1), tz será negativo (más cerca de la cámara)
                // Si es oscuro (Luminance ~ 0), tz será 0 (plano base)
                tz = -luminance * 300; // Multiplicador de profundidad
              }

              // Aplicar fricción para movimiento suave
              p.x += (tx - p.x) * (1 - this.config.friction);
              p.y += (ty - p.y) * (1 - this.config.friction);
              p.z += (tz - p.z) * (1 - this.config.friction);

              // Coordenadas Mundiales (Relativas a cámara)
              let wx = p.x + distFromCam;
              let wy = p.y;
              let wz = p.z;

              // Rotación 3D
              let x1 = wx * cosY - wz * sinY;
              let z1 = wz * cosY + wx * sinY;
              
              let y1 = wy * cosX - z1 * sinX;
              let z2 = z1 * cosX + wy * sinX;

              // Proyección Perspectiva
              const zScale = FOCAL_LENGTH / (FOCAL_LENGTH + z2);

              if (z2 > -FOCAL_LENGTH + 10 && zScale > 0) {
                 const x2d = cx + x1 * zScale;
                 const y2d = cy + y1 * zScale;
                 const s = this.config.size * zScale;

                 // Vignette / Desvanecimiento por distancia
                 const dist = Math.sqrt(x1*x1 + y1*y1);
                 const alphaFade = Math.max(0, 1 - (dist / 1300));

                 if (alphaFade > 0.01) {
                   ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.a * alphaFade})`;
                   ctx.fillRect(x2d, y2d, s, s);
                 }
              }
            }
          });

          requestAnimationFrame(() => this.loop());
        }
      }

      /**
       * App Class
       * Controlador principal de la UI y Estado.
       */
      class App {
        constructor() {
          this.images = [...INITIAL_IMAGES];
          this.activeIndex = 0;
          this.engine = new Engine(document.getElementById('canvas'));
          this.isAnalyzing = false;
          
          // Referencias al DOM
          this.ui = {
            dock: document.getElementById('dock-container'),
            fileInput: document.getElementById('file-input'),
            btnAutoAI: document.getElementById('btn-auto-ai'),
            aiIcon: document.getElementById('ai-icon'),
            inputs: {
              gap: document.getElementById('input-gap'),
              friction: document.getElementById('input-friction'),
              size: document.getElementById('input-size'),
              valGap: document.getElementById('val-gap'),
              valFriction: document.getElementById('val-friction'),
              valSize: document.getElementById('val-size'),
            },
            modes: {
              structure: document.getElementById('mode-structure'),
              nebula: document.getElementById('mode-nebula'),
            }
          };

          this.init();
        }

        init() {
          this.engine.setImages(this.images);
          this.engine.start();
          this.renderDock();
          this.bindEvents();
        }

        bindEvents() {
          // Configuración Manual
          const updateConfig = () => {
            const newConfig = {
              gap: parseInt(this.ui.inputs.gap.value),
              friction: parseFloat(this.ui.inputs.friction.value),
              size: parseFloat(this.ui.inputs.size.value),
            };
            
            this.ui.inputs.valGap.textContent = `${newConfig.gap}px`;
            this.ui.inputs.valFriction.textContent = newConfig.friction.toFixed(2);
            this.ui.inputs.valSize.textContent = `${newConfig.size.toFixed(1)}px`;
            
            this.engine.setConfig(newConfig);
          };

          ['gap', 'friction', 'size'].forEach(key => {
            this.ui.inputs[key].addEventListener('input', updateConfig);
          });

          // Modos
          this.ui.modes.structure.addEventListener('click', () => this.setMode('structure'));
          this.ui.modes.nebula.addEventListener('click', () => this.setMode('nebula'));

          // Subir Imagen
          this.ui.fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
              this.addImage(e.target.files[0]);
            }
          });

          // Gemini AI
          this.ui.btnAutoAI.addEventListener('click', () => {
            this.runAutoConfig();
          });
        }

        setMode(mode) {
          this.engine.setConfig({ mode });
          if (mode === 'structure') {
            this.ui.modes.structure.className = "flex-1 py-1.5 text-xs font-medium rounded-md transition-all bg-white/20 text-white shadow-sm";
            this.ui.modes.nebula.className = "flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white";
          } else {
            this.ui.modes.structure.className = "flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white";
            this.ui.modes.nebula.className = "flex-1 py-1.5 text-xs font-medium rounded-md transition-all bg-purple-500/30 text-purple-200 shadow-sm";
          }
        }

        renderDock() {
          this.ui.dock.innerHTML = '';
          
          // Lista de miniaturas
          this.images.forEach((img, idx) => {
            const isActive = idx === this.activeIndex;
            const btn = document.createElement('button');
            btn.className = `dock-item relative group transition-all duration-500 ease-out flex-shrink-0 ${
              isActive ? 'active w-20 h-20 -translate-y-2' : 'w-14 h-14 opacity-60 hover:opacity-100 hover:scale-105'
            }`;
            
            btn.innerHTML = `
              <div class="w-full h-full rounded-full overflow-hidden border-2 border-white/20 transition-all">
                <img src="${img.url}" alt="${img.title}" class="w-full h-full object-cover">
              </div>
              <div class="label absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-blue-200 whitespace-nowrap tracking-widest opacity-0 transition-opacity duration-300">
                ACTIVE
              </div>
            `;
            btn.onclick = () => this.selectImage(idx);
            this.ui.dock.appendChild(btn);
          });

          // Separador
          const sep = document.createElement('div');
          sep.className = "w-[1px] h-8 bg-white/20 mx-2 flex-shrink-0";
          this.ui.dock.appendChild(sep);

          // Botón Añadir
          const addBtn = document.createElement('button');
          addBtn.className = "w-12 h-12 rounded-full border border-dashed border-white/40 flex items-center justify-center text-white/60 hover:text-white hover:border-white hover:bg-white/10 transition-all flex-shrink-0";
          addBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
          addBtn.onclick = () => this.ui.fileInput.click();
          this.ui.dock.appendChild(addBtn);
        }

        selectImage(index) {
          this.activeIndex = index;
          this.engine.setActiveIndex(index);
          this.renderDock();
        }

        addImage(file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            if (e.target.result) {
              this.images.push({
                id: Date.now().toString(),
                url: e.target.result,
                title: file.name
              });
              this.engine.setImages(this.images);
              this.selectImage(this.images.length - 1);
            }
          };
          reader.readAsDataURL(file);
        }

        async runAutoConfig() {
          if (this.isAnalyzing) return;
          
          // Access API KEY safely
          const apiKey = (typeof process !== 'undefined' && process.env) ? process.env.API_KEY : '';
          
          if (!apiKey) {
            alert("API Key no encontrada en process.env.API_KEY.");
            return;
          }
          
          this.isAnalyzing = true;
          this.ui.btnAutoAI.disabled = true;
          this.ui.aiIcon.innerHTML = `<svg class="animate-spin h-3 w-3 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

          try {
            const activeImg = this.images[this.activeIndex];
            let base64 = "";

            if (activeImg.url.startsWith('data:')) {
              base64 = activeImg.url.split(',')[1];
            } else {
              // En caso de URLs externas que permitan CORS
              const resp = await fetch(activeImg.url);
              const blob = await resp.blob();
              base64 = await new Promise((resolve) => {
                const r = new FileReader();
                r.onloadend = () => resolve(r.result.split(',')[1]);
                r.readAsDataURL(blob);
              });
            }

            const ai = new GoogleGenAI({ apiKey: apiKey });
            const response = await ai.models.generateContent({
              model: "gemini-2.5-flash",
              contents: {
                parts: [
                   { inlineData: { mimeType: "image/png", data: base64 } },
                   { text: "Analyze visual complexity. Return JSON with 'gap' (1-10, lower for complex), 'friction' (0.85-0.99), 'size' (0.5-5.0)." }
                ]
              },
              config: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: Type.OBJECT,
                  properties: {
                    gap: { type: Type.INTEGER },
                    friction: { type: Type.NUMBER },
                    size: { type: Type.NUMBER }
                  },
                  required: ["gap", "friction", "size"]
                }
              }
            });

            const result = JSON.parse(response.text);
            if (result) {
              this.ui.inputs.gap.value = result.gap;
              this.ui.inputs.friction.value = result.friction;
              this.ui.inputs.size.value = result.size;
              
              this.ui.inputs.gap.dispatchEvent(new Event('input'));
              this.ui.inputs.friction.dispatchEvent(new Event('input'));
              this.ui.inputs.size.dispatchEvent(new Event('input'));
            }

          } catch (e) {
            console.error(e);
            alert("Error al analizar con Gemini. Revisa la consola.");
          } finally {
            this.isAnalyzing = false;
            this.ui.btnAutoAI.disabled = false;
            this.ui.aiIcon.textContent = "✨";
          }
        }
      }

      // Iniciar aplicación
      window.addEventListener('DOMContentLoaded', () => {
        new App();
      });
    </script>
  </body>
</html>
